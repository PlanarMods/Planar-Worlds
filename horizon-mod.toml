# Migration package. The SDK entry point and package validate, while the
# legacy function-replacement declarations below still require adaptation.
# See README.md and target/migration-0.3.7/validation.json for validation scope.
id = "planar_worlds"
name = "Planar Worlds"
version = "0.3.7"
description = "A 2D side-scrolling Overworld with background walls and trees."
authors = ["PlanarMods"]
license = "MIT"
license_url = "https://github.com/PlanarMods/Planar-Worlds/blob/main/LICENSE"
homepage = "https://github.com/PlanarMods/Planar-Worlds"
issues = "https://github.com/PlanarMods/Planar-Worlds/issues"
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

