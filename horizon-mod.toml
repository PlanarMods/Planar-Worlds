# planar-crack-origin: refused twice. MODIFY_ARG/MODIFY_VARIABLE on
# Game::entity_geometry, with or without a `slice`, both fail with
# E_UNSUPPORTED_MACRO (ambiguous macro identity in the copied body), while a
# HEAD mixin on the same function applies — so the tool allows insertion, not
# rewriting, here. Background cracks therefore render at foreground depth.
# The helper stays in src/hooks/planar-crack-origin.rs.

